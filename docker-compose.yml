services:
  basket:
    build: .
    ports:
      - "8080:3000"
    environment:
      PORT: "3000"
      DATA_DIR: /data
      # Set to "true" if you put Basket behind HTTPS.
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      TZ: Europe/London
    volumes:
      - basket-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5

volumes:
  basket-data:
